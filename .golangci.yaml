run:
  concurrency: 2
  timeout: 10m0s
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
output:
  formats:
￼    - format: line-number
￼      path: stdout
